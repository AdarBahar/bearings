name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: python3 -m compileall scripts/

      - name: Unit tests
        run: python3 -m unittest discover tests -v

      - name: Shellcheck
        run: shellcheck install.sh scripts/install-schedule.sh
